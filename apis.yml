name: 3DaGoGo
description: >-
  3DaGoGo, Inc. is a San Diego based technology company and the maker of
  AstroPrint, a cloud platform for consumer and professional 3D printing.
  AstroPrint provides browser-based cloud slicing, AI-powered model generation
  from text prompts, remote WiFi printer control, live video print monitoring,
  print-queue management, multi-user access controls, and analytics, serving
  more than 260,000 users across 130+ countries with over 5 million objects
  printed. AstroPrint exposes an OAuth 2.0 protected REST API
  (api.astroprint.com/v2) plus a client-side 3D Print API so third parties can
  build applications on top of the platform. 3DaGoGo was surfaced as a portfolio
  company of 500 Global and has been enriched from its public developer surface.
